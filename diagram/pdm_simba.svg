<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1080" width="2100" height="1080" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
