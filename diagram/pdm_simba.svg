    <marker id="ERone" viewBox="0 0 10 16" refX="5" refY="8" markerWidth="10" markerHeight="16" orient="auto">
        <line x1="5" y1="0" x2="5" y2="16" stroke="#00AAAA" stroke-width="1.8" />
    </marker>
    <!-- PowerDesigner ERoneToMany marker: Mandatory Many crow's foot with tick mark '>-|' -->
    <marker id="ERoneToMany" viewBox="0 0 18 16" refX="16" refY="8" markerWidth="18" markerHeight="16" orient="auto">
        <line x1="4" y1="0" x2="4" y2="16" stroke="#00AAAA" stroke-width="1.8" />
