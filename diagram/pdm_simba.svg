    <rect x="80" y="15" width="2090" height="42" rx="4" ry="4" fill="#E5FFFF" stroke="#00AAAA" stroke-width="1.5"/>
    <text x="1125" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">PHYSICAL DATA MODEL (PDM) SISTEM INFORMASI SIMBA</text>
    <text x="1125" y="47" text-anchor="middle" font-size="11" fill="#333333">Balai Pemasyarakatan (Bapas) Kelas I Banjarmasin - Model Fisik Basis Data (Notasi PowerDesigner PDM dengan Kolom Fisik, &lt;pk&gt;, &lt;fk&gt;, dan &lt;index&gt;)</text>
    

    <rect x="80" y="990" width="2090" height="30" fill="#E5FFFF" stroke="#00AAAA" stroke-width="1"/>
    <text x="95" y="1010" font-size="11" fill="#000000">
        <tspan font-weight="bold">Keterangan Notasi PDM:</tspan>
        <tspan dx="15">&#8226; <tspan text-decoration="underline">Garis Bawah</tspan> = Primary Key (&lt;pk&gt;)</tspan>
        <tspan dx="15">&#8226; &lt;fk&gt; / &lt;fk1..3&gt; = Foreign Key</tspan>
        <tspan dx="15">&#8226; &lt;i&gt; / &lt;i1..4&gt; = Index Constraint</tspan>
        <tspan dx="15">&#8226; | = Mandatory One (1)</tspan>
        <tspan dx="15">&#8226; &gt;-| = Mandatory Many (1,n)</tspan>
    </text>
    
