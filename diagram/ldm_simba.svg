        .subtitle-text { font-size: 11px; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
        .ent-header-bg { fill: #E5FFFF; stroke: #00AAAA; stroke-width: 1.5; }
        .ent-header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .ent-body-bg { fill: #FFFFFF; stroke: #00AAAA; stroke-width: 1.5; }
        .ent-attr-text { font-size: 11px; fill: #000000; font-family: Consolas, monospace, Helvetica; }
        .ent-pi-bg { fill: #E5FFFF; stroke: #00AAAA; stroke-width: 1.5; }
        .ent-pi-text { font-size: 11px; fill: #000000; font-family: Consolas, monospace, Helvetica; }
        .rel-line { stroke: #00AAAA; stroke-width: 1.5; fill: none; }
        .label-bg { fill: #ffffff; stroke: #00AAAA; stroke-width: 0.8; rx: 3; ry: 3; }
        .label-text { font-size: 11px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .underline { text-decoration: underline; font-weight: bold; }
    </style>
