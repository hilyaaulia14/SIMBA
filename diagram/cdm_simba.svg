    <rect x="80" y="15" width="1560" height="42" rx="4" ry="4" fill="#E5FFFF" stroke="#00AAAA" stroke-width="1.5"/>
    <text x="860" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">CONCEPTUAL DATA MODEL (CDM) SISTEM INFORMASI SIMBA</text>
    <text x="860" y="47" text-anchor="middle" font-size="11" fill="#333333">Balai Pemasyarakatan (Bapas) Kelas I Banjarmasin - Berdasarkan ERD Fiks (Notasi PowerDesigner CDM)</text>
    

    <rect x="80" y="940" width="1560" height="30" fill="#E5FFFF" stroke="#00AAAA" stroke-width="1"/>
    <text x="95" y="960" font-size="11" fill="#000000">
        <tspan font-weight="bold">Keterangan Notasi CDM:</tspan>
        <tspan dx="15">&#8226; <tspan text-decoration="underline">Garis Bawah</tspan> = Primary Identifier (&lt;pi&gt;)</tspan>
        <tspan dx="15">&#8226; | = Mandatory One (1)</tspan>
        <tspan dx="15">&#8226; &gt;-| = Mandatory Many (1,n / 0,n)</tspan>
        <tspan dx="15">&#8226; Relasi menghubungkan konsep bisnis SIMBA tanpa foreign key redundan</tspan>
    </text>
    
